name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # One zip for every Blender: a rigacar/ folder with blender_manifest.toml installs as an extension on
      # Blender 4.2 and later, and with bl_info as a legacy add-on before. .gitattributes leaves tests and docs out.
      - name: Package the add-on
        run: git archive --prefix=rigacar/ --format=zip HEAD -o rigacar-${{ github.ref_name }}.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rigacar-${{ github.ref_name }}.zip
